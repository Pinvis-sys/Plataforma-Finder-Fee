name: Testes

on:
  push:
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pytest -q
      - name: Simulação da Camada 2
        env:
          FLASK_APP: app:create_app
        run: flask simulate-bonus

  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finder
          POSTGRES_PASSWORD: finder
          POSTGRES_DB: finder_fee_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FF_TEST_DATABASE_URL: postgresql+psycopg://finder:finder@localhost:5432/finder_fee_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t finder-fee .
      - name: Sobe o container e confere a saúde, o usuário e o bloqueio da chave fraca
        run: |
          docker run -d --name ff -p 8000:8000 -e FF_SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(48))") -e FF_COOKIE_SECURE=0 finder-fee
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/saude && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/saude
          test "$(docker exec ff id -u)" = "10001"
          docker logs ff 2>&1 | grep -q "Banco pronto."
          if docker logs ff 2>&1 | grep -iE "error|traceback"; then exit 1; fi
          if docker run --rm -e FF_SECRET_KEY=curta finder-fee flask init-db; then echo "subiu com chave fraca"; exit 1; fi
