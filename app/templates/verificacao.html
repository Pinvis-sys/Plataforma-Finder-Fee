{% extends 'public.html' %}
{% block title %}Verificação em duas etapas{% endblock %}
{% block content %}
<div class="panel" style="max-width:440px">
  <h1>Verificação em duas etapas</h1>
  <p>Digite o código de 6 dígitos do aplicativo autenticador.</p>
  <form method="post" class="stack">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Código <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required autofocus></label>
    <button type="submit">Confirmar código</button>
  </form>
</div>
{% endblock %}
